<!doctype html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Theme Color for Mobile Browsers -->
  <meta name="theme-color" content="#667eea" />
  <meta name="msapplication-TileColor" content="#667eea" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Stale deploy guard: jeśli przeglądarka ma stary index.html po deployu,
       skrypt/CSS z nieistniejącym hashem zwróci 404 (ResourceError).
       Wykrywamy to i wymuszamy twarde przeładowanie — raz, żeby nie zapętlić. -->
  <script>
    (function () {
      var RELOAD_KEY = '__rm_reload_ts';
      window.addEventListener('error', function (e) {
        var tag = e.target && e.target.tagName;
        if (tag !== 'SCRIPT' && tag !== 'LINK') return;
        var last = sessionStorage.getItem(RELOAD_KEY);
        var now = Date.now();
        // Maksymalnie jeden reload co 10 sekund, żeby nie zapętlić przy trwałych błędach
        if (last && now - parseInt(last, 10) < 10000) return;
        sessionStorage.setItem(RELOAD_KEY, String(now));
        // reload(true) jest deprecated i ignorowany w nowoczesnych przeglądarkach —
        // zamiast tego nawiguj na ten sam URL z timestamp, co wymusza pobranie z serwera
        var sep = location.search ? '&' : '?';
        location.replace(location.pathname + location.search + sep + '_v=' + now + (location.hash || ''));
      }, true);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Powierzchnie reklamowe w całej Polsce – billboardy, citylighty, banery, ekrany LED. Sprawdź oferty na mapie, porównaj ceny i skontaktuj się z wystawcą." />
  <meta name="keywords"
    content="powierzchnie reklamowe, billboardy, citylighty, banery reklamowe, wynajem billboardu, reklama zewnętrzna" />
  <meta name="author" content="ReklaMap" />
  <meta name="robots" content="index, follow" />

  <title>Wynajem powierzchni reklamowych w Polsce | ReklaMap</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0ZL0NS8F9W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-0ZL0NS8F9W');
  </script>

  <!-- Google reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=%VITE_RECAPTCHA_SITE_KEY%"></script>

</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
