<!doctype html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Theme Color for Mobile Browsers -->
  <meta name="theme-color" content="#667eea" />
  <meta name="msapplication-TileColor" content="#667eea" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Stale deploy guard: jeśli przeglądarka ma stary index.html po deployu,
       skrypt/CSS z nieistniejącym hashem zwróci 404 (ResourceError).
       Wykrywamy to i wymuszamy twarde przeładowanie — raz, żeby nie zapętlić. -->
  <script>
    (function () {
      var RELOAD_KEY = '__rm_reload_ts';
      window.addEventListener('error', function (e) {
        var tag = e.target && e.target.tagName;
        if (tag !== 'SCRIPT' && tag !== 'LINK') return;
        var last = sessionStorage.getItem(RELOAD_KEY);
        var now = Date.now();
        // Maksymalnie jeden reload co 10 sekund, żeby nie zapętlić przy trwałych błędach
        if (last && now - parseInt(last, 10) < 10000) return;
        sessionStorage.setItem(RELOAD_KEY, String(now));
        window.location.reload(true);
      }, true);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- SEO Meta Tags -->
