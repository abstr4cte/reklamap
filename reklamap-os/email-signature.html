<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szablon e-mail — ReklaMap</title>
  <!--
    JAK UŻYWAĆ W THUNDERBIRDZIE:
    1. Otwórz w przeglądarce, Ctrl+A, Ctrl+C.
    2. Thunderbird: Nowa wiadomość → Format → HTML → Ctrl+V.
    3. Wpisz treść w miejsce oznaczone komentarzem poniżej.
    Lub zainstaluj dodatek "Stationery" i wskaż ten plik jako szablon.
  -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
    }
    .logo-image {
      height: 75px;
      width: auto;
      object-fit: contain;
    }
    .tagline {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      margin: 8px 0 0 0;
    }
    .content {
      padding: 40px 30px;
    }
    .footer {
      background-color: #f9fafb;
      padding: 30px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }
    .footer-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 15px 0;
    }
    .footer-link {
      color: #1a0dab;
      text-decoration: underline;
      margin: 0 10px;
      font-size: 14px;
    }
    @media only screen and (max-width: 600px) {
      .content { padding: 30px 20px; }
      .header  { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="email-container">

    <div class="header">
      <a href="https://reklamap.pl">
        <img src="https://reklamap.pl/logo-text.webp" alt="ReklaMap" class="logo-image">
      </a>
      <p class="tagline">Portal powierzchni reklamowych</p>
    </div>

    <div class="content" style="font-size: 15px; line-height: 1.7; color: #4b5563;">

      <p style="margin: 0 0 16px 0;">Dzień dobry,</p>

      <!-- TREŚĆ WIADOMOŚCI -->

      <p style="margin: 0 0 16px 0;">&nbsp;</p>
      <p style="margin: 0 0 16px 0;">&nbsp;</p>

      <!-- KONIEC TREŚCI -->

      <p style="margin: 24px 0 0 0;">
        Z poważaniem,<br>
        <strong style="color: #1f2937;">Zespół ReklaMap</strong>
      </p>

    </div>

    <div class="footer">
      <div>
        <a href="https://reklamap.pl" class="footer-link">Strona główna</a>
        <a href="https://reklamap.pl/kontakt" class="footer-link">Kontakt</a>
        <a href="https://reklamap.pl/regulamin" class="footer-link">Regulamin</a>
      </div>
      <p style="color: #9ca3af; font-size: 12px; margin: 20px 0 0 0;">
        © 2026 ReklaMap. Wszelkie prawa zastrzeżone.
      </p>
    </div>

  </div>
</body>
</html>
