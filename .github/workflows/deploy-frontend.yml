name: Deploy frontend (prerender → Hostido)

# Po pushu na master (gdy zmienił się front lub ten workflow): zbuduj z prerenderem
# i wgraj na Hostido przez rsync/SSH. Build leci na runnerze GitHuba (tam Chromium działa) —
# na Hostido trafia gotowy statyczny HTML. Deploy tylko gdy testy frontu przejdą.

# UWAGA: auto-deploy z CI jest WYŁĄCZONY. Prerender robi ~435 żądań do api.reklamap.pl;
# z IP runnerów GitHuba Hostido blokuje to jako nadużycie (sitemap/API zwraca 0 → pusty build).
# Niezawodna ścieżka to lokalny `frontend/deploy.sh` (build+prerender lokalnie → rsync).
# Ten workflow zostaje jako ręczny (gdyby kiedyś doszedł self-hosted runner / allowlist IP).
on:
  workflow_dispatch: {}

# Nie pozwól dwóm deployom nadpisywać się nawzajem
concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sprawdź wymagane sekrety (bez nich NIE deployujemy)
        run: |
          miss=0
          for s in SSH_PRIVATE_KEY DEPLOY_PATH VITE_INTERNAL_APP_KEY VITE_GOOGLE_MAPS_API_KEY VITE_RECAPTCHA_SITE_KEY VITE_APP_URL; do
            case "$s" in
              SSH_PRIVATE_KEY) v="${{ secrets.SSH_PRIVATE_KEY }}" ;;
              DEPLOY_PATH) v="${{ secrets.DEPLOY_PATH }}" ;;
              VITE_INTERNAL_APP_KEY) v="${{ secrets.VITE_INTERNAL_APP_KEY }}" ;;
              VITE_GOOGLE_MAPS_API_KEY) v="${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" ;;
              VITE_RECAPTCHA_SITE_KEY) v="${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" ;;
              VITE_APP_URL) v="${{ secrets.VITE_APP_URL }}" ;;
            esac
            [ -n "$v" ] || { echo "::error::Brak sekretu $s — przerwane (nie wdrażamy niekompletnego builda)"; miss=1; }
          done
          [ "$miss" = 0 ] || exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache pobranego Chromium dla puppeteer (przyspiesza kolejne buildy)
      - name: Cache puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install deps
        run: npm ci

      - name: Frontend tests (bramka)
        run: npm run test -- --run

      - name: Build + prerender
        env:
          VITE_INTERNAL_APP_KEY: ${{ secrets.VITE_INTERNAL_APP_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: npm run build:seo

      - name: Załaduj klucz SSH (ssh-agent)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy (rsync dist → serwer)
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Weryfikacja (bot widzi treść)
        run: |
          sleep 5
          T=$(curl -s -A "Googlebot/2.1" "https://reklamap.pl/powierzchnie-reklamowe/billboardy/koszalin" | grep -oiE '<title>[^<]*</title>' | head -1)
          echo "Tytuł u bota: $T"
          echo "$T" | grep -qi "Billboardy Koszalin" && echo "✅ prerender serwowany" || (echo "⚠️ sprawdź .htaccess / ścieżkę deploya" && exit 1)
